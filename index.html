<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFSHTS Practical ICT Skills Lab — Interactive LMS</title>
<meta name="description" content="AFSHTS Interactive ICT Skills LMS">
<meta name="theme-color" content="#17365d">

<style>
:root{
  --navy:#17365d;
  --blue:#2f5597;
  --light:#eef3f8;
  --green:#2e7d32;
  --amber:#a15c00;
  --red:#b42318;
  --line:#d8dee8;
  --bg:#f6f8fb;
  --white:#fff;
  --text:#202938;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font:15px Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  background:var(--navy);
  color:#fff;
  padding:16px 20px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
header h1{margin:0 0 4px;font-size:22px}
#top{font-size:14px;line-height:1.5}
.top-row{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  flex-wrap:wrap;
}
.top-progress{
  min-width:260px;
  flex:1;
  max-width:520px;
}
.layout{
  display:grid;
  grid-template-columns:240px 1fr;
  min-height:calc(100vh - 86px);
}
aside{
  background:#fff;
  border-right:1px solid var(--line);
  padding:10px;
  position:sticky;
  top:86px;
  height:calc(100vh - 86px);
  overflow:auto;
}
nav button{
  width:100%;
  padding:10px;
  margin:2px 0;
  text-align:left;
  border:0;
  background:transparent;
  border-radius:7px;
  cursor:pointer;
  color:var(--text);
}
nav button:hover,nav button.sel{
  background:var(--light);
  font-weight:bold;
  color:var(--navy);
}
main{
  padding:22px;
  max-width:1100px;
  width:100%;
  margin:auto;
}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px;
  margin:14px 0;
}
h2,h3{color:var(--navy)}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
}
.kpi{
  background:#fbfcfe;
  border-left:5px solid var(--blue);
  padding:14px;
  border-radius:6px;
}
.kpi-number{
  font-size:30px;
  font-weight:bold;
  margin:6px 0;
}
.progress{
  height:12px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
}
.progress-bar{
  height:100%;
  background:var(--blue);
  width:0%;
  transition:width .35s ease;
}
.module-progress{margin:10px 0}
button{
  font:inherit;
}
button.primary{
  background:var(--blue);
  color:#fff;
  border:0;
  padding:10px 14px;
  border-radius:7px;
  cursor:pointer;
}
button.primary:hover{opacity:.9}
button.secondary{
  background:#fff;
  color:var(--blue);
  border:1px solid var(--blue);
  padding:9px 13px;
  border-radius:7px;
  cursor:pointer;
}
button:disabled{
  opacity:.55;
  cursor:not-allowed;
}
.option{
  border:1px solid var(--line);
  padding:11px;
  margin:7px 0;
  border-radius:7px;
  background:#fafcff;
  cursor:pointer;
}
.option:hover{background:var(--light)}
.feedback{
  padding:11px;
  margin-top:10px;
  border-radius:7px;
  background:#f1f5f9;
}
.ok{background:#e8f5e9}
.warn{background:#fff3df}
.bad{
  background:#fde8e7;
}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:14px;
  font-size:12px;
  font-weight:bold;
}
.green{background:#e8f5e9;color:var(--green)}
.amber{background:#fff1da;color:var(--amber)}
.red{background:#fde8e7;color:var(--red)}
.step{
  border:1px solid var(--line);
  padding:12px;
  border-radius:7px;
  background:#fafcff;
}
input,textarea,select{
  width:100%;
  padding:10px;
  border:1px solid #b7c1ce;
  border-radius:6px;
  margin:5px 0 10px;
}
textarea{min-height:100px;resize:vertical}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border:1px solid var(--line);
  padding:8px;
  text-align:left;
}
th{background:var(--light)}
.small{font-size:13px;color:#5d6675}
.video{
  background:#17253a;
  color:#fff;
  border-radius:9px;
  padding:22px;
  text-align:center;
  margin:10px 0;
}
.play{font-size:38px}
.module-card{
  border:1px solid var(--line);
  border-radius:9px;
  padding:14px;
  margin:10px 0;
  background:#fff;
}
.completed{
  border-left:5px solid var(--green);
}
.activity-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}
.notice{
  padding:12px;
  border-radius:8px;
  background:#eef3f8;
  margin:10px 0;
}
#connectionStatus{
  font-size:12px;
  opacity:.9;
}
@media(max-width:760px){
  .layout{grid-template-columns:1fr}
  aside{
    position:static;
    height:auto;
    border-right:0;
    border-bottom:1px solid var(--line);
  }
  main{padding:14px}
  .top-progress{min-width:100%}
}
</style>
</head>

<body>
<header>
  <div class="top-row">
    <div>
      <h1>AFSHTS Practical ICT Skills Lab</h1>
      <div id="top">Interactive LMS — Final Prototype</div>
      <div id="connectionStatus">Progress is saved locally and synced to Supabase when available.</div>
    </div>
    <div class="top-progress">
      <div class="progress">
        <div id="globalProgressBar" class="progress-bar"></div>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <aside>
    <nav id="nav"></nav>
  </aside>
  <main id="app"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =========================================================
   AFSHTS INTERACTIVE LMS
   Clean replacement version
   ========================================================= */

/* ---------- SUPABASE ---------- */
const SUPABASE_URL = "https://mfuvtilepoyyddbzkbrd.supabase.co";
const SUPABASE_KEY = "sb_publishable_XEHJaJD0sXLwzWi0AWBrSA_L4ARsztu";

let supabaseClient = null;

try {
  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  console.log("Supabase connected successfully.");
} catch (error) {
  console.error("Supabase connection failed:", error);
}
try {
  if (window.supabase && typeof window.supabase.createClient === "function") {
    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  }
} catch (err) {
  console.warn("Supabase could not be initialized:", err);
}

/* ---------- COURSE DATA ---------- */
const M = [
  ["M0","🎯 Orientation & Diagnostic",[
    "Welcome",
    "How the course works",
    "Digital safety",
    "Adaptive diagnostic",
    "Self-rating",
    "Mouse & keyboard warm-up"
  ]],
  ["M1","🌐 Browser Foundations",[
    "Meet the browser",
    "Icon challenge",
    "Address bar vs search",
    "Guided practice",
    "Independence check"
  ]],
  ["M2","🔎 URLs & Searching",[
    "What is a URL?",
    "URL mission",
    "Search keyword challenge",
    "Choose a useful result",
    "Find → verify → retrieve"
  ]],
  ["M3","🔐 Email Login",[
    "What is email?",
    "Secure login",
    "Login error clinic",
    "Independent login"
  ]],
  ["M4","✉️ Composing Email",[
    "Compose",
    "Recipient challenge",
    "Subject challenge",
    "Message builder",
    "Composition check"
  ]],
  ["M5","📎 File Attachment",[
    "Why attachments matter",
    "Locate the file",
    "Attach the file",
    "Attachment error lab",
    "Attachment mastery"
  ]],
  ["M6","✅ Send & Verify",[
    "Final checks",
    "Send",
    "Verify in Sent",
    "Send-and-verify challenge"
  ]],
  ["M7","🛡️ Netiquette",[
    "Email netiquette",
    "Privacy & safe links",
    "Responsible search"
  ]],
  ["M8","🏆 Integrated Challenge",[
    "Prepare",
    "Perform authentic task",
    "Self-check"
  ]],
  ["M9","📈 Remediation & Mastery",[
    "Mastery status",
    "Targeted remediation",
    "Adaptive reassessment",
    "Troubleshoot with a peer",
    "Completion & transfer"
  ]]
];

const TOTAL_ACTIVITIES = M.reduce(
  (sum, module) => sum + module[2].length,
  0
);

/* ---------- LEARNER STATE ---------- */
const DEFAULT_STATE = {
  learnerName: "",
  done: [],
  xp: 0,
  mastery: null,
  score: null,
  posts: [],
  diagnosticLevel: "not assessed"
};

function loadState(){
  try{
    const saved = JSON.parse(
      localStorage.getItem("afshts_lms_state") || "null"
    );

    if(saved && typeof saved === "object"){
      return {...DEFAULT_STATE, ...saved};
    }
  }catch(err){
    console.warn("Could not read saved state:",err);
  }

  return {...DEFAULT_STATE};
}

let S = loadState();

/* ---------- HELPERS ---------- */
const app = document.getElementById("app");

function save(){
  localStorage.setItem(
    "afshts_lms_state",
    JSON.stringify(S)
  );
}

function pct(){
  if(!TOTAL_ACTIVITIES) return 0;
  return Math.min(
    100,
    Math.round((S.done.length / TOTAL_ACTIVITIES) * 100)
  );
}

function status(){
  if(S.mastery === true){
    return ["green","GREEN — MASTERED"];
  }

  if(S.mastery === false){
    return ["red","RED — REMEDIATION"];
  }

  return ["amber","AMBER — IN PROGRESS"];
}

function moduleProgress(moduleId){
  const module = M.find(m => m[0] === moduleId);
  if(!module) return {completed:0,total:0,percent:0};

  const total = module[2].length;
  const completed = S.done.filter(
    key => key.startsWith(moduleId + "-")
  ).length;

  return {
    completed,
    total,
    percent: total
      ? Math.round((completed / total) * 100)
      : 0
  };
}

function updateTop(){
  const s = status();
  const percent = pct();

  document.getElementById("top").textContent =
    `XP: ${S.xp} | Progress: ${percent}% | ${s[1]}`;

  document.getElementById("globalProgressBar").style.width =
    percent + "%";
}

function awardXP(amount){
  S.xp += amount;
  save();
  updateTop();
}

async function syncProgress(moduleId, activityId, xp){
  if(!supabaseClient) return false;

  const learnerName =
    S.learnerName.trim() || "Demo Learner";

  try{
    const {error} = await supabaseClient
      .from("learner_progress")
      .upsert(
        {
          learner_name: learnerName,
          module_id: moduleId,
          activity_id: activityId,
          completed: true,
          xp: xp
        },
        {
          onConflict: "learner_name,module_id,activity_id"
        }
      );

    if(error){
      console.warn("Supabase sync failed:",error);
      return false;
    }

    document.getElementById("connectionStatus").textContent =
      "✓ Progress synced to Supabase.";
    return true;
  }catch(err){
    console.warn("Supabase sync error:",err);
    return false;
  }
}

async function completeActivity(key, xpAmount=10){
  if(!S.done.includes(key)){
    S.done.push(key);
    S.xp += xpAmount;
    save();

    const parts = key.split("-");
    const moduleId = parts[0];
    const activityId = parts.slice(1).join("-");

    await syncProgress(
      moduleId,
      activityId,
      xpAmount
    );
  }

  updateTop();
  buildNav();
}

function setLearnerName(){
  const input = document.getElementById("learnerNameInput");
  if(!input) return;

  const name = input.value.trim();

  if(!name){
    alert("Please enter your name.");
    return;
  }

  S.learnerName = name;
  save();
  updateTop();
  home();
}

/* ---------- NAVIGATION ---------- */
function buildNav(active="home"){
  const nav = document.getElementById("nav");

  nav.innerHTML = `
    <button data-page="home">🏠 Dashboard</button>
    ${M.map(m =>
      `<button data-page="${m[0]}">${m[1]}</button>`
    ).join("")}
    <hr>
    <button data-page="peer">🤝 Peer Collaboration</button>
    <button data-page="analytics">📊 Analytics</button>
    <button data-page="badges">🏅 Achievements</button>
    <button data-page="about">ℹ️ Design Notes</button>
    <button id="resetBtn">↺ Reset Local Progress</button>
  `;

  nav.querySelectorAll("[data-page]").forEach(button => {
    button.addEventListener("click", () => {
      buildNav(button.dataset.page);
      route(button.dataset.page);
    });
  });

  document.getElementById("resetBtn").addEventListener("click",()=>{
    if(confirm(
      "Reset this learner's local progress? This will clear the browser's saved progress."
    )){
      localStorage.removeItem("afshts_lms_state");
      location.reload();
    }
  });

  const selected = nav.querySelector(
    `[data-page="${active}"]`
  );

  if(selected) selected.classList.add("sel");
}

function route(page){
  if(page === "home") return home();
  if(page === "peer") return peer();
  if(page === "analytics") return analytics();
  if(page === "badges") return badges();
  if(page === "about") return about();

  modulePage(page);
}

/* ---------- DASHBOARD ---------- */
function home(){
  const s = status();

  app.innerHTML = `
    <div class="card">
      <h2>🎓 Learner Dashboard</h2>

      <p>
        Welcome,
        <strong>${escapeHTML(
          S.learnerName || "Demo Learner"
        )}</strong>
      </p>

      <div class="notice">
        Your dashboard updates immediately whenever an activity is completed.
        The progress bar above also updates in real time.
      </div>

      <div class="grid">

        <div class="card">
          <h3>📊 Overall Progress</h3>
          <div class="progress">
            <div
              class="progress-bar"
              style="width:${pct()}%"
            ></div>
          </div>
          <p class="kpi-number">${pct()}%</p>
          <p class="small">
            ${S.done.length} of ${TOTAL_ACTIVITIES}
            activities completed
          </p>
        </div>

        <div class="card">
          <h3>⭐ XP Points</h3>
          <p class="kpi-number">${S.xp}</p>
          <p class="small">Experience points earned</p>
        </div>

        <div class="card">
          <h3>✅ Completed</h3>
          <p class="kpi-number">${S.done.length}</p>
          <p class="small">Learning activities completed</p>
        </div>

        <div class="card">
          <h3>🏆 Mastery</h3>
          <p>
            <span class="badge ${s[0]}">${s[1]}</span>
          </p>
          <p class="small">
            Diagnostic: ${escapeHTML(S.diagnosticLevel)}
          </p>
        </div>

      </div>
    </div>

    <div class="card">
      <h3>👤 Learner Information</h3>
      <label for="learnerNameInput">
        Learner name
      </label>

      <input
        id="learnerNameInput"
        value="${escapeAttribute(S.learnerName)}"
        placeholder="Enter learner name"
      >

      <button class="primary" id="saveNameBtn">
        Save Learner Name
      </button>
    </div>

    <div class="card">
      <h3>📚 Learning Modules</h3>
      <p>
        Select a module below to continue learning.
      </p>

      <div id="dashboardModules"></div>
    </div>
  `;

  document.getElementById("saveNameBtn")
    .addEventListener("click",setLearnerName);

  const box =
    document.getElementById("dashboardModules");

  M.forEach(m=>{
    const p = moduleProgress(m[0]);

    const div = document.createElement("div");
    div.className =
      "module-card" +
      (p.percent === 100 ? " completed" : "");

    div.innerHTML = `
      <h3>${m[1]}</h3>

      <div class="module-progress">
        <div class="progress">
          <div
            class="progress-bar"
            style="width:${p.percent}%"
          ></div>
        </div>
      </div>

      <p>
        ${p.completed} of ${p.total}
        activities completed
        — <strong>${p.percent}%</strong>
      </p>

      <button class="primary">
        Open Module
      </button>
    `;

    div.querySelector("button")
      .addEventListener("click",()=>{
        buildNav(m[0]);
        modulePage(m[0]);
      });

    box.appendChild(div);
  });
}

/* ---------- MODULE PAGE ---------- */
function modulePage(id){
  const m = M.find(x=>x[0] === id);

  if(!m){
    home();
    return;
  }

  const p = moduleProgress(id);

  app.innerHTML = `
    <div class="card">
      <h2>${m[1]}</h2>
      <p>
        Complete the activities below.
        Completed activities remain saved in this browser.
      </p>

      <div class="progress">
        <div
          class="progress-bar"
          style="width:${p.percent}%"
        ></div>
      </div>

      <p>
        Module progress:
        <strong>${p.percent}%</strong>
        (${p.completed}/${p.total})
      </p>
    </div>

    <div id="activities"></div>
  `;

  const activities =
    document.getElementById("activities");

  m[2].forEach((title,index)=>{
    activities.appendChild(
      createActivity(id,index,title)
    );
  });
}

/* ---------- ACTIVITY ENGINE ---------- */
function createActivity(moduleId,index,title){
  const key = `${moduleId}-${index}`;
  const completed = S.done.includes(key);

  const card = document.createElement("div");
  card.className =
    "card" + (completed ? " completed" : "");

  card.innerHTML = `
    <h3>
      ${index + 1}. ${title}
      ${completed
        ? '<span class="badge green">Completed</span>'
        : ''
      }
    </h3>

    <div class="activity-content"></div>

    <div class="activity-actions"></div>
  `;

  const content =
    card.querySelector(".activity-content");

  const actions =
    card.querySelector(".activity-actions");

  renderActivityContent(
    moduleId,
    index,
    title,
    key,
    content,
    actions,
    completed
  );

  return card;
}

function renderActivityContent(
  moduleId,
  index,
  title,
  key,
  content,
  actions,
  completed
){
  /* M0 diagnostic */
  if(moduleId === "M0" && index === 3){
    content.innerHTML = `
      <p>
        Answer the question below. This diagnostic helps
        identify the learner's starting level.
      </p>

      <p><strong>
        Which action is safest when receiving an unexpected email attachment?
      </strong></p>

      <div class="option" data-answer="wrong">
        A. Open it immediately.
      </div>

      <div class="option" data-answer="correct">
        B. Verify the sender and attachment before opening it.
      </div>

      <div class="option" data-answer="wrong">
        C. Forward it to everyone.
      </div>

      <div class="option" data-answer="wrong">
        D. Disable all security warnings.
      </div>

      <div id="feedback-${key}"></div>
    `;

    content.querySelectorAll(".option")
      .forEach(option=>{
        option.addEventListener("click",()=>{
          const feedback =
            document.getElementById(
              `feedback-${key}`
            );

          if(option.dataset.answer === "correct"){
            S.diagnosticLevel = "foundation ready";
            feedback.className =
              "feedback ok";
            feedback.textContent =
              "Correct. Good digital-safety judgement.";

            S.mastery = S.mastery === null
              ? null
              : S.mastery;

            save();
            completeActivity(key,15);
            option.parentElement
              .querySelectorAll(".option")
              .forEach(x=>x.style.pointerEvents="none");
          }else{
            S.diagnosticLevel = "needs support";
            feedback.className =
              "feedback warn";
            feedback.textContent =
              "Not quite. Verify unexpected attachments before opening them.";
            save();
          }
        });
      });

    return;
  }

  /* M1 browser icon challenge */
  if(moduleId === "M1" && index === 1){
    content.innerHTML = `
      <p>
        Which browser feature is normally used to enter
        a website address?
      </p>

      <div class="option" data-answer="wrong">
        Desktop wallpaper
      </div>

      <div class="option" data-answer="correct">
        Address bar
      </div>

      <div class="option" data-answer="wrong">
        Recycle Bin
      </div>

      <div id="feedback-${key}"></div>
    `;

    addQuizHandlers(content,key,15);
    return;
  }

  /* M2 URL challenge */
  if(moduleId === "M2" && index === 1){
    content.innerHTML = `
      <p>
        Select the item that is a complete website address.
      </p>

      <div class="option" data-answer="wrong">
        computer
      </div>

      <div class="option" data-answer="correct">
        https://www.example.com
      </div>

      <div class="option" data-answer="wrong">
        search words
      </div>

      <div id="feedback-${key}"></div>
    `;

    addQuizHandlers(content,key,15);
    return;
  }

  /* M7 privacy challenge */
  if(moduleId === "M7" && index === 1){
    content.innerHTML = `
      <p>
        You receive a link asking for your password.
        What should you do?
      </p>

      <div class="option" data-answer="wrong">
        Enter the password immediately.
      </div>

      <div class="option" data-answer="correct">
        Verify the source and avoid entering credentials through a suspicious link.
      </div>

      <div class="option" data-answer="wrong">
        Share the link with classmates.
      </div>

      <div id="feedback-${key}"></div>
    `;

    addQuizHandlers(content,key,15);
    return;
  }

  /* M9 reassessment */
  if(moduleId === "M9" && index === 2){
    content.innerHTML = `
      <p>
        Mastery target: <strong>16/20</strong> or better,
        with no critical safety failure.
      </p>

      <label for="score-${key}">
        Enter reassessment score out of 20
      </label>

      <input
        id="score-${key}"
        type="number"
        min="0"
        max="20"
        placeholder="e.g. 18"
      >

      <div id="feedback-${key}"></div>
    `;

    const button =
      document.createElement("button");

    button.className = "primary";
    button.textContent =
      completed ? "Reassess Again" : "Submit Score";

    button.addEventListener("click",()=>{
      const score =
        Number(
          document.getElementById(
            `score-${key}`
          ).value
        );

      if(!Number.isFinite(score) ||
         score < 0 ||
         score > 20){
        alert("Enter a score from 0 to 20.");
        return;
      }

      S.score = score;
      S.mastery = score >= 16;
      save();

      const feedback =
        document.getElementById(
          `feedback-${key}`
        );

      feedback.className =
        S.mastery ? "feedback ok" : "feedback warn";

      feedback.textContent =
        S.mastery
          ? "Mastery achieved. Excellent work."
          : "Remediation is recommended. Review the weak areas and try again.";

      completeActivity(key,20);
      updateTop();
    });

    actions.appendChild(button);
    return;
  }

  /* Generic practical activity */
  content.innerHTML = `
    <p>
      <strong>Learning task:</strong>
      ${activityInstruction(moduleId,index,title)}
    </p>

    <div class="notice">
      Complete the task practically, then click
      <strong>Mark Activity Complete</strong>.
    </div>
  `;

  const button =
    document.createElement("button");

  button.className =
    completed ? "secondary" : "primary";

  button.textContent =
    completed
      ? "✓ Activity Completed"
      : "Mark Activity Complete";

  button.disabled = completed;

  button.addEventListener("click",async()=>{
    await completeActivity(key,10);

    cardCompleteRefresh(
      moduleId,
      index,
      title
    );
  });

  actions.appendChild(button);
}

function addQuizHandlers(content,key,xpAmount){
  content.querySelectorAll(".option")
    .forEach(option=>{
      option.addEventListener("click",async()=>{
        const feedback =
          document.getElementById(
            `feedback-${key}`
          );

        if(option.dataset.answer === "correct"){
          feedback.className =
            "feedback ok";
          feedback.textContent =
            "Correct. Activity completed.";

          content.querySelectorAll(".option")
            .forEach(x=>{
              x.style.pointerEvents="none";
            });

          await completeActivity(
            key,
            xpAmount
          );

          updateTop();
        }else{
          feedback.className =
            "feedback warn";
          feedback.textContent =
            "Not quite. Review the options and try again.";
        }
      });
    });
}

/* ---------- PEER COLLABORATION ---------- */
function peer(){
  app.innerHTML = `
    <div class="card">
      <h2>🤝 Peer Collaboration</h2>
      <p>
        Use this space to record a short troubleshooting note.
      </p>

      <textarea
        id="peerPost"
        placeholder="Describe the ICT problem, what you tried and what solved it..."
      ></textarea>

      <button class="primary" id="postBtn">
        Save Peer Note
      </button>
    </div>

    <div class="card">
      <h3>Saved Notes</h3>
      <div id="posts"></div>
    </div>
  `;

  document.getElementById("postBtn")
    .addEventListener("click",()=>{
      const text =
        document.getElementById("peerPost")
          .value.trim();

      if(!text){
        alert("Write a note first.");
        return;
      }

      S.posts.push({
        text,
        date:new Date().toLocaleString()
      });

      save();
      peer();
    });

  const posts =
    document.getElementById("posts");

  if(!S.posts.length){
    posts.innerHTML =
      "<p class='small'>No peer notes yet.</p>";
  }else{
    S.posts.slice().reverse().forEach(post=>{
      const div =
        document.createElement("div");

      div.className = "step";
      div.innerHTML = `
        <p>${escapeHTML(post.text)}</p>
        <p class="small">${escapeHTML(post.date)}</p>
      `;

      posts.appendChild(div);
    });
  }
}

/* ---------- SECURITY / DISPLAY HELPERS ---------- */
function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttribute(value){
  return escapeHTML(value);
}
