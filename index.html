.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 70px)}
aside{background:white;border-right:1px solid var(--line);padding:10px;position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}
nav button{width:100%;padding:9px;margin:2px 0;text-align:left;border:0;background:transparent;border-radius:7px;cursor:pointer}
nav button:hover,nav .sel{background:var(--p);font-weight:bold;color:var(--n)}
main{padding:22px;max-width:1050px;width:100%;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}

button.secondary{background:#fff;color:var(--b);border:1px solid var(--b);padding:9px 13px;border-radius:7px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.kpi{background:#fbfcfe;border-left:5px solid var(--b);padding:12px;border-radius:6px}
.progress{height:10px;background:#e5e7eb;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:var(--b)}
.step,.option{border:1px solid var(--line);padding:10px;margin:7px 0;border-radius:7px;background:#fafcff}.option{cursor:pointer}.option:hover{background:var(--p)}
.feedback{padding:10px;margin-top:10px;border-radius:7px;background:#f1f5f9}.ok{background:#e8f5e9}.warn{background:#fff3df}
.badge{padding:5px 9px;border-radius:14px;font-size:12px;font-weight:bold}.green{background:#e8f5e9;color:var(--g)}.amber{background:#fff1da;color:var(--a)}.red{background:#fde8e7;color:var(--r)}
.video{background:#17253a;color:white;border-radius:9px;padding:22px;text-align:center;margin:10px 0}.play{font-size:38px;cursor:pointer}
textarea,input{width:100%;padding:9px;border:1px solid #b7c1ce;border-radius:6px;margin:5px 0 10px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--line);padding:8px;text-align:left}th{background:var(--p)}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
</style>

async function saveProgress(learnerName, moduleId, activityId, xp) {
    const { error } = await supabaseClient
        .from("learner_progress")
        .upsert({
            learner_name: learnerName,
            module_id: moduleId,
            activity_id: activityId,
            completed: true,
            xp: xp
        });

    if (error) {
        console.error("Progress save error:", error);
        return false;
    }

    console.log("Progress saved successfully!");
    return true;
}

["M6","✅ Send & Verify",["Final checks","Send","Verify in Sent","Send-and-verify challenge"]],

const total=M.reduce((n,m)=>n+m[2].length,0);

const pct=()=>Math.round(S.done.length/total*100);
function status(){return S.mastery===true?["green","GREEN — MASTERED"]:S.mastery===false?["red","RED — REMEDIATION"]:["amber","AMBER — IN PROGRESS"]}

async function done(k,n=10){
  if(!S.done.includes(k)){
    S.done.push(k);

    const learnerName = S.learnerName || "Demo Learner";

      learnerName,
      moduleId,
      activityId,
      n
    );

    if(!saved){
      console.error("Supabase progress was not saved.");
    }
  }else{
    save();
  }
  buildNav();
  updateTop();
}

        `;

        home();
    }
}

M.forEach(m=>n.innerHTML+=`<button data-p="${m[0]}">${m[1]}</button>`);
n.innerHTML+=`<hr><button data-p="peer">🤝 Peer Collaboration</button><button data-p="analytics">📊 Analytics</button><button data-p="badges">🏅 Achievements</button><button data-p="about">ℹ️ Design Notes</button><button id="reset">↺ Reset</button>`;
n.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{n.querySelectorAll("button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");route(b.dataset.p)});
document.getElementById("reset").onclick=()=>{if(confirm("Reset local learner data?")){localStorage.removeItem("afshts_v3");location.reload()}}}
function route(p){p==="home"?home():p==="peer"?peer():p==="analytics"?analytics():p==="badges"?badges():p==="about"?about():module(p)}
function home(){
    app.innerHTML = `
        <div class="card">
            <h2>🎓 Learner Dashboard</h2>
            <p>Welcome, <strong>${S.learnerName || "Demo Learner"}</strong></p>

            <div class="grid">

                <div class="card">
                    <h3>📊 Overall Progress</h3>

                    <div class="progress">
                        <div class="progress-bar"
                             style="width:${pct()}%">
                        </div>
                    </div>

                    <p><strong>${pct()}%</strong> completed</p>
                </div>

                <div class="card">
                    <h3>⭐ XP Points</h3>
                    <p style="font-size:32px;font-weight:bold;">
                        ${S.xp}
                    </p>
                </div>

                <div class="card">
                    <h3>✅ Activities Completed</h3>
                    <p style="font-size:32px;font-weight:bold;">
                        ${S.done.length}
                    </p>
                </div>

                <div class="card">
                    <h3>🏆 Mastery Status</h3>
                    <p>${status()}</p>
                </div>

            </div>

            <div class="card">
                <h3>📚 Learning Modules</h3>
                <p>Select a module below to continue learning.</p>
                <div id="dashboardModules"></div>
            </div>
        </div>
    `;

    const moduleBox = document.getElementById("dashboardModules");

    M.forEach(m => {
        const completed = S.done.filter(
            k => k.startsWith(m[0] + "-")
        ).length;

        const total = m[2].length;

        moduleBox.innerHTML += `

                <h3>${m[1]}</h3>

                         style="width:${progress}%">
                    </div>
                </div>

                <p>
                    ${completed} of ${total} activities completed
                </p>

                <button class="primary"
                        onclick="module('${m[0]}')">
                    Open Module
                </button>
            </div>
        `;
    });
}

    M.forEach(m => {
        const completed = s.done.filter(k => k.startsWith(m[0] + "-")).length;

        const progress = total
            ? Math.round((completed / total) * 100)
            : 0;

        moduleBox.innerHTML += `

                <h3>${m[1]}</h3>

                    <div class="progress-bar"
                         style="width:${progress}%"></div>
                </div>

}
">${s[1]}</span><p>${pct()}% complete • ${S.xp} XP</p><div class="progress"><div style="width:${pct()}%"></div></div></div>
<div class="grid"><div class="kpi"><b>Primary task</b><br>Compose, attach, send and verify an email.</div><div class="kpi"><b>High-priority skill</b><br>File attachment.</div><div class="kpi"><b>Mastery</b><br>16/20 + no critical failure.</div><div class="kpi"><b>Adaptive assessment</b><br>Difficulty changes with performance.</div></div>
<div class="card"><h3>Gamified learning loop</h3><div class="grid"><div class="step">🎮 XP + levels</div><div class="step">🏅 Achievement badges</div><div class="step">🤝 Peer troubleshooting</div><div class="step">🧠 Adaptive quizzes</div><div class="step">🎬 Interactive media</div><div class="step">📊 Analytics</div></div></div>
<div class="card"><h3>Start</h3><button class="primary" onclick="module('M0')">Open diagnostic</button></div>`}
function module(id){let m=M.find(x=>x[0]===id);app.innerHTML=`<div class="card"><h2>${m[1]}</h2><p>Complete the activities. Practical evidence has priority over completion alone.</p></div><div id="acts"></div>`;
m[2].forEach((a,i)=>activity(id,i,a))}
function activity(mid,i,a){let k=mid+"-"+i,el=document.createElement("div");el.className="card";el.innerHTML=`<h3>${i+1}. ${a}</h3><div id="c${k}"></div><div id="a${k}"></div>`;acts.appendChild(el);let c=el.querySelector("#c"+k),q=el.querySelector("#a"+k);
if(mid==="M0"&&i===3)return diagnostic(c,q,k);
if(mid==="M1"&&i===1)return quiz(c,q,k,"Which control enters a website address?",["Refresh","Address bar","Back"],1);
if(mid==="M2"&&i===2)return quiz(c,q,k,"Which is the strongest search query?",["email","safe email communication for students","things on the Internet"],1);
if(mid==="M4"&&i===2)return quiz(c,q,k,"Which is the strongest subject?",["Hi","ICT Assignment Submission — Form 2","Important"],1);
if(mid==="M5"&&i===3)return quiz(c,q,k,"The attachment is not visible. What should you do?",["Send immediately","Wait for upload and confirm the attachment appears","Close the browser"],1,20);
if(mid==="M5"&&i===4)return attachment(c,q,k);
if(mid==="M8"&&i===1)return integrated(c,q,k);
if(mid==="M9"&&i===2)return reassess(c,q,k);
c.innerHTML=`<p>${text(a)}</p><div class="video"><div><div class="play">▶</div><div>Interactive demonstration: ${a}</div><small>Click ▶ to reveal the next procedural step.</small></div></div><div class="step"><b>Practice:</b> Perform the action yourself. In pairs, rotate Driver/Navigator roles.</div>`;
q.innerHTML=`<button class="primary">${S.done.includes(k)?"Completed ✓":"Complete activity"}</button>`;q.firstChild.onclick=()=>{done(k);q.firstChild.textContent="Completed ✓"}}
function text(a){let x={"Meet the browser":"Identify address bar, Back, Forward, Refresh and New Tab.","Address bar vs search":"Use the address bar for URLs and a search engine for information.","What is a URL?":"A URL is a web address used to reach a web location.","URL mission":"Enter the supplied URL accurately and confirm the intended page.","What is email?":"Inbox contains received messages; Sent contains messages you have sent.","Secure login":"Use an authorised practice account and protect the password.","Compose":"Open a new message and identify recipient, subject and message.","Recipient challenge":"Check the assigned recipient carefully.","Message builder":"Use a greeting, purpose, relevant information and closing.","Composition check":"Check recipient, subject and message before attachment.","Why attachments matter":"An attachment sends a file with an email; confirm the correct file before sending.","Locate the file":"Use the attachment control to find the required file.","Attach the file":"Wait for loading and confirm the attachment is visible.","Final checks":"Check recipient, subject, message and attachment before Send.","Send":"Send only after final checks.","Verify in Sent":"Confirm the message appears in Sent and is correct.","Email netiquette":"Use respectful language and meaningful subjects.","Privacy & safe links":"Protect passwords/private information and treat suspicious links cautiously.","Responsible search":"Use search tools responsibly.","Prepare":"Read the task and locate the required file.","Self-check":"Identify the step that needs more practice.","Mastery status":"Green = independent; Amber = with support; Red = not yet independently demonstrated.","Targeted remediation":"Practise only the procedure shown by evidence to be weak.","Troubleshoot with a peer":"Explain a correction without taking over the peer's task.","Completion & transfer":"Identify one authentic use of email."};return x[a]||"Observe, practise, receive feedback and repeat until you can perform independently."}
function quiz(c,q,k,p,opts,ans,points=15){c.innerHTML=`<p>${p}</p>${opts.map((x,i)=>`<label class="option"><input type="radio" name="${k}" value="${i}"> ${x}</label>`).join("")}<div id="f${k}" class="feedback"></div>`;q.innerHTML=`<button class="primary">Check answer</button>`;q.firstChild.onclick=()=>{let r=document.querySelector('input[name="'+k+'"]:checked'),f=document.getElementById("f"+k);if(!r){f.textContent="Choose an answer.";return}if(+r.value===ans){f.className="feedback ok";f.textContent="Correct. XP awarded.";done(k,points)}else{f.className="feedback warn";f.textContent="Not yet. Review the explanation and try again.";S.xp=Math.max(0,S.xp-2);save();updateTop()}}}
function diagnostic(c,q,k){let qs=[["Which control enters a URL?",["Refresh","Address bar","Back"],1],["Where can you verify a sent email?",["Inbox","Sent","Browser history"],1],["What must be confirmed before sending an attachment?",["Only the browser","Recipient, message and attachment","Nothing"],1]],i=0,cor=0;c.innerHTML=`<p>Adaptive diagnostic: difficulty responds to your answers.</p><div id="dq"></div><div id="df" class="feedback"></div>`;function show(){let z=qs[i];document.getElementById("dq").innerHTML=`<b>Question ${i+1}/3</b>${z[1].map((o,j)=>`<label class="option"><input type="radio" name="ad" value="${j}"> ${o}</label>`).join("")}`;q.innerHTML=`<button class="primary">Check</button>`;q.firstChild.onclick=()=>{let r=document.querySelector('input[name="ad"]:checked'),f=document.getElementById("df");if(!r){f.textContent="Choose an answer.";return}if(+r.value===z[2]){cor++;f.className="feedback ok";f.textContent="Correct — difficulty increases."}else{f.className="feedback warn";f.textContent="Review the skill — next item remains foundational."}i++;if(i<3)setTimeout(show,400);else{S.quizCorrect=cor;S.quizTotal=3;save();done(k,20);f.textContent=`Diagnostic complete: ${cor}/3. Use teacher evidence to place yourself on Red/Amber/Green pathway.`}}}show()}
function attachment(c,q,k){c.innerHTML=`<p>High-priority attachment checkpoint.</p>${["Locate correct file","Select correct file","Wait for upload","Confirm attachment is visible"].map(x=>`<label class="option"><input type="checkbox"> ${x}</label>`).join("")}`;q.innerHTML=`<button class="primary">Submit checklist</button>`;q.firstChild.onclick=()=>{let n=c.querySelectorAll("input:checked").length;if(n===4){done(k,25);q.innerHTML="<div class='feedback ok'>Checklist complete. Teacher must validate independent live performance.</div>"}else q.innerHTML=`<div class='feedback warn'>${n}/4 complete. Finish the attachment sequence.</div>`}}
function integrated(c,q,k){c.innerHTML=`<p><b>Authentic task:</b> Complete browser/search → login → compose → recipient → subject → message → attach → send → verify.</p><div class="step">Teacher scores the live task using the 20-mark rubric.</div>`;q.innerHTML=`<button class="primary">Launch practical</button>`;q.firstChild.onclick=()=>{done(k,30);q.innerHTML="<div class='feedback ok'>Practical task launched. Complete it independently and ask the teacher to record the rubric.</div>"}}
function reassess(c,q,k){c.innerHTML=`<p>Enter the teacher-awarded score for a novel equivalent practical task.</p><input id="score" type="number" min="0" max="20"><label class="option"><input id="crit" type="checkbox"> No critical failure occurred.</label><div id="rf" class="feedback"></div>`;q.innerHTML=`<button class="primary">Record mastery</button>`;q.firstChild.onclick=()=>{let sc=+document.getElementById("score").value,cr=document.getElementById("crit").checked;if(sc<0||sc>20||Number.isNaN(sc))return;S.score=sc;S.critical=cr;S.mastery=sc>=16&&cr;save();done(k,25);document.getElementById("rf").className="feedback "+(S.mastery?"ok":"warn");document.getElementById("rf").innerHTML=`<b>${status()[1]}</b><br>${sc}/20. ${S.mastery?"Mastery achieved.":"Remediation required."}`}}
function peer(){app.innerHTML=`<div class="card"><h2>🤝 Peer Collaboration Hub</h2><p><b>Driver:</b> operates the computer. <b>Navigator:</b> checks the procedure and gives prompts. Swap roles.</p><textarea id="post" rows="3" placeholder="Share a troubleshooting tip..."></textarea><button class="primary" id="postbtn">Post tip</button><div id="feed"></div></div>`;feed();postbtn.onclick=()=>{let v=post.value.trim();if(v){S.posts.push(v);save();xp(10);post.value="";feed()}}}
function feed(){document.getElementById("feed").innerHTML=S.posts.length?S.posts.map(x=>`<div class="step">🤝 <b>Peer tip</b><br>${x}</div>`).join(""):"<p class='small'>No tips yet.</p>"}
function analytics(){let rows=M.map(m=>{let d=m[2].filter((_,i)=>S.done.includes(m[0]+"-"+i)).length;return `<tr><td>${m[0]} — ${m[1]}</td><td>${Math.round(d/m[2].length*100)}%</td></tr>`}).join("");app.innerHTML=`<div class="card"><h2>📊 Learner Analytics Dashboard</h2><div class="grid"><div class="kpi"><b>Completion</b><br>${pct()}%</div><div class="kpi"><b>XP</b><br>${S.xp}</div><div class="kpi"><b>Quiz accuracy</b><br>${S.quizTotal?Math.round(S.quizCorrect/S.quizTotal*100):0}%</div><div class="kpi"><b>Mastery</b><br>${status()[1]}</div></div></div><div class="card"><h3>Module progress</h3><table><tr><th>Module</th><th>Progress</th></tr>${rows}</table></div><div class="card"><h3>Intervention signal</h3><p>${S.mastery===false?"🔴 Targeted remediation required. Prioritise the skill identified by practical evidence.":S.mastery===true?"🟢 Mastery achieved. Assign transfer/troubleshooting.":"🟠 Continue formative practice and collect live practical evidence."}</p></div><div class="card"><h3>Production analytics</h3><p>Capture diagnostic performance, attempts, time on task, attachment errors, login errors, mastery, intervention referrals and pre/post reassessment results.</p></div>`}
function badges(){let b=[];if(S.xp>=50)b.push("🌱 Practice Starter");if(S.xp>=100)b.push("⭐ 100 XP");if(S.done.includes("M5-4"))b.push("📎 Attachment Specialist");if(S.mastery===true)b.push("🏆 Independent Performer");if(S.posts.length)b.push("🤝 Peer Helper");app.innerHTML=`<div class="card"><h2>🏅 Achievements</h2><p>Badges reward meaningful practice; they do not replace mastery assessment.</p><div class="grid">${b.map(x=>`<div class="step">${x}</div>`).join("")||"<div class='step'>Complete activities to unlock badges.</div>"}</div></div>`}
function about(){app.innerHTML=`<div class="card"><h2>ℹ️ Design Notes</h2><p>This redesign preserves the approved AFSHTS instructional sequence and strengthens interaction through gamification, structured peer collaboration, adaptive diagnostics, interactive multimedia, analytics and mastery-based assessment.</p><h3>Teacher remains central</h3><p>The LMS supports diagnosis, feedback, intervention and analytics. It cannot replace observation of live browser/email performance.</p><h3>Security</h3><p>Use only test/practice accounts and dummy files. Never enter learner passwords.</p></div>`}
buildNav();updateTop();home();
</script>
